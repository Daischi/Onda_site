name: Publicar demonstração ONDA

on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - '.github/workflows/demo-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ler arquivos da demonstração
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Empacotar apenas a demonstração
        uses: actions/upload-pages-artifact@v3
        with:
          path: demo
      - name: Publicar demonstração
        id: deployment
        uses: actions/deploy-pages@v5
