services:
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
  worker:
    build: .
    env_file: .env
    command: ["npm", "run", "worker"]
    restart: unless-stopped
# Use PostgreSQL gerenciado em DATABASE_URL e um proxy HTTPS na frente do web.
# Execute migrations e bootstrap administrativo antes de abrir o tráfego.
